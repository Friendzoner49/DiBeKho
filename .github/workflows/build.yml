# Build the Windows installer (this Python app) and the Mac app (DiBeKho Swift, from the branch Mac_swift) on
# GitHub's machines. The Python app is no longer built for the Mac (since 21/11/2026); its old .dmg stays on the
# v0.6.2 release and earlier.
# - Push a tag like v0.1.0: builds both and publishes a GitHub Release (an old release with the same tag
#   and all earlier runs of this workflow are deleted first). The README download buttons
#   point to releases/latest/download/<fixed file name>, so they always give the newest release.
# - "Run workflow" in the Actions tab: builds only (files under "Artifacts" on the run page).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# A tag moved to a newer commit replaces a run that is still going for the same tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Mac app in Swift, from the branch Mac_swift (a snapshot of its own repository).
  mac_swift:
    runs-on: macos-15  # Apple Silicon (arm64)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Mac_swift
      - run: bash scripts/make_app.sh
        env:  # the app's version = the tag (its update check compares the two); a build by hand keeps Info.plist's.
          # The shop's Cloud address is put into the build (builtin.json); never in the repository.
          DIBEKHO_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          DIBEKHO_CLOUD_URL: ${{ secrets.DIBEKHO_CLOUD_URL }}
          DIBEKHO_CLOUD_KEY: ${{ secrets.DIBEKHO_CLOUD_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: DiBeKho-Swift-mac
          path: build/DiBeKho-Swift-mac-arm64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
        env:  # the shop's Cloud address, put into the build (scripts/make_cloud_builtin.py); never in the repository
          DIBEKHO_CLOUD_URL: ${{ secrets.DIBEKHO_CLOUD_URL }}
          DIBEKHO_CLOUD_KEY: ${{ secrets.DIBEKHO_CLOUD_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: DiBeKho-windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac_swift, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Fixed names for the README links (the version is in the release title). The installer is also
      # zipped: browsers (Edge SmartScreen) block an unsigned, rarely downloaded .exe, not a .zip.
      - run: |
          cp artifacts/DiBeKho-Swift-mac-arm64.dmg .
          cp artifacts/*-windows-setup.exe DiBeKho-windows-setup.exe
          zip -j DiBeKho-windows-setup.zip DiBeKho-windows-setup.exe
          ls -la
      # Only once both builds succeeded: remove the old release with this tag (and its files) and every
      # earlier run of this workflow (and its artifacts). The tag itself is kept; older releases are not touched.
      - name: Remove old release and old runs
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          for id in $(gh run list --workflow build --limit 200 --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "${{ github.run_id }}" ]; then gh run delete "$id" || true; fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          name: DiBeKho ${{ github.ref_name }}
          files: |
            DiBeKho-Swift-mac-arm64.dmg
            DiBeKho-windows-setup.exe
            DiBeKho-windows-setup.zip
