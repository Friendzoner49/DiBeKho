# Run by hand only (Actions -> build -> Run workflow): the macOS minutes of a private repo are limited
# (GitHub Free: about 190 minutes a month). Daily builds are done on the Mac with Xcode.
name: build

on:
  workflow_dispatch:
    inputs:
      screens:
        description: "Make the app, start it and keep screenshots (about 2 more minutes)"
        type: boolean
        default: false
      version:
        description: "The version stamped into the app (empty: the newest v* tag of this repository)"
        type: string
        default: ""
      runner:
        description: "The machine: macos-15 (the usual one) or macos-26, the owner's own macOS"
        type: string
        default: "macos-15"

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the v* tags: the app is stamped with the newest one (the update check compares the two)
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Toolchain
        run: sw_vers && swift --version && xcodebuild -version
      - name: Build and test
        run: DIBEKHO_XLSX_OUT="$PWD/xlsx-out" DIBEKHO_SHOP_OUT="$PWD/shop.sqlite" swift test 2>&1 | tee test.log
        shell: bash -o pipefail {0}
      - name: The .xlsx files the tests wrote hold what the Python app's files hold (read by openpyxl)
        run: |
          python3 -m venv /tmp/check-env
          /tmp/check-env/bin/pip install --quiet openpyxl
          /tmp/check-env/bin/python tools/check_xlsx.py Tests/DiBeKhoCoreTests/XlsxRef xlsx-out 2>&1 | tee xlsx-check.log
        shell: bash -o pipefail {0}
      - name: Keep the resolved package versions and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            Package.resolved
            test.log
          if-no-files-found: ignore
      - name: The version to stamp (the newest release tag, the same number as the Python app)
        if: inputs.screens
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="$(git tag -l 'v*' | sort -V | tail -1)"
          [ -n "$V" ] || { echo "no v* tag and no version given"; exit 1; }
          echo "DIBEKHO_VERSION=$V" >> "$GITHUB_ENV"
          echo "the app is stamped ${V#v}"
      - name: Make the app
        if: inputs.screens
        run: bash scripts/make_app.sh
        env:  # the shop's Cloud address, put into the build (builtin.json); never in the repository
          DIBEKHO_CLOUD_URL: ${{ secrets.DIBEKHO_CLOUD_URL }}
          DIBEKHO_CLOUD_KEY: ${{ secrets.DIBEKHO_CLOUD_KEY }}
      - name: The app opens on a made-up shop (a screenshot per page)
        if: inputs.screens
        run: |
          set -e
          shoot() {
            DIBEKHO_OPEN="$PWD/shop.sqlite" DIBEKHO_SCAN_NOTES="${4:-}" DIBEKHO_PAGE="$1" DIBEKHO_WINDOW="$2" \
              "build/DiBeKho Swift.app/Contents/MacOS/DiBeKhoSwift" & pid=$!
            sleep 7
            kill -0 $pid
            screencapture -x "build/screen-$3.png" || true
            kill $pid
            sleep 1
          }
          shoot stock "" 01-stock
          shoot pending "" 02-pending "$PWD/Tests/DiBeKhoCoreTests/ScanNotes"
          shoot search "" 03-search
          shoot receipts "" 04-receipts
          shoot count "" 05-count
          shoot settings "" 06-settings
          DIBEKHO_SETTINGS_TAB=1 DIBEKHO_LEARNED_OPEN=1 shoot settings "" 06b-settings-products
          DIBEKHO_SETTINGS_TAB=2 shoot settings "" 06c-settings-transfer
          shoot search orders 07-orders
          shoot search stats 08-stats
          shoot count transfers 09-transfers
          shoot count transfer 10-transfer
          shoot count trial 11-trial
          shoot receipts receipt 12-receipt
          shoot stock order 13-order
          shoot stock issue 14-issue
          DIBEKHO_SETTINGS_TAB=3 shoot settings "" 06d-settings-cloud
          shoot search customers 15-customers
          shoot search customer 16-customer-detail
          shoot stock product 17-product-detail
          shoot count trials 18-trials
          echo "the app opened and stayed open on every page: OK"
      - name: The dialogs work with real clicks and keys (see the screen-20-* screenshots)
        if: inputs.screens
        run: |
          # Phiếu xuất kho: an old customer picked from the list (the arrow at the right end of the box), then typed
          bash tools/ci_dialogs.sh issue customer-pick click 786 194 wait 1 shot 1 down return wait 1 shot 2
          bash tools/ci_dialogs.sh issue customer-type click 450 194 paste "Khách Mẫu" tab wait 1 shot 1
          # Phiếu xuất kho: a few letters without accents bring up the customers that fit, then ↓ and Return pick one
          bash tools/ci_dialogs.sh issue customer-suggest click 450 194 paste khach wait 1 shot 1 down return \
            wait 1 shot 2
          # letter by letter, as a hand types: the list opens and stays open while it narrows
          bash tools/ci_dialogs.sh issue customer-letters click 450 194 paste k paste h paste a paste c paste h \
            wait 1 shot 1
          # the box never types over the user: a name begun with its accents, then one more letter
          bash tools/ci_dialogs.sh issue customer-typing click 450 194 paste "Khách" wait 1 paste " " wait 1 shot 1
          # Phiếu xuất kho: row 1 → «Chọn mặt hàng có sẵn…» → the catalog window → SP002 found and Return
          # (the menu's first item lies just under the mouse: clicked with the mouse, then with the keyboard)
          bash tools/ci_dialogs.sh issue product click 187 468 wait 1 shot 1 click 300 479 wait 2 shot 2 \
            paste SP002 return wait 2 shot 3
          bash tools/ci_dialogs.sh issue product-keys click 187 468 wait 1 return wait 2 shot 1
          # the second item («Mặt hàng mới…»): the mouse goes over the first one on its way, as a hand does
          bash tools/ci_dialogs.sh issue product-second click 187 468 wait 1 move 300 479 move 300 501 \
            click 300 501 wait 2 shot 1
          # over the items and back before picking the first one (a hand reading the menu)
          bash tools/ci_dialogs.sh issue product-wander click 187 468 wait 1 move 300 479 move 300 501 move 300 479 \
            click 300 479 wait 2 shot 1
          # the catalog window: one click on a row, then Đồng ý; then the form takes a quantity for that row
          bash tools/ci_dialogs.sh issue product-ok click 187 468 wait 1 click 300 479 wait 2 click 300 198 \
            wait 1 shot 1 click 883 681 wait 2 shot 2 click 601 468 paste 3 tab wait 1 shot 3
          # the catalog window: a double click on its first row
          bash tools/ci_dialogs.sh issue product-dclick click 187 468 wait 1 click 300 479 wait 2 shot 1 \
            dclick 300 168 wait 2 shot 2
          # Phiếu xuất kho: «Khách hàng mới…» opens its dialog, which takes typing
          bash tools/ci_dialogs.sh issue new-customer click 896 194 wait 2 paste "Khách Thử" wait 1 shot 1
          # a dialog opened by a button of a page (Kiểm kê → Chuyển…): its list and buttons alive
          PAGE=count bash tools/ci_dialogs.sh - transfer-button click 791 252 wait 2 shot 1
          # Hàng về: «Nhập vào» (a Picker) → the next place
          bash tools/ci_dialogs.sh receipt place click 560 226 wait 1 shot 1 down return wait 1 shot 2
          # Hàng về: «Nhà cung cấp» picked from the list (NSComboBox, the arrow at the right end)
          bash tools/ci_dialogs.sh receipt supplier click 972 253 wait 1 shot 1 down return wait 1 shot 2
          # Hàng về: row 1 → the product menu → «Mặt hàng mới…» (the second item, the mouse over the first on its way)
          bash tools/ci_dialogs.sh receipt receipt-product click 262 462 wait 1 shot 1 move 380 473 move 380 495 \
            click 380 495 wait 2 shot 2
      - name: macOS draws the Excel files the app wrote (Quick Look thumbnails)
        if: inputs.screens
        run: |
          for f in issue_1 receipt_1; do qlmanage -t -s 1400 -o build "xlsx-out/$f.xlsx" || true; done
          ls build
      - uses: actions/upload-artifact@v4
        if: inputs.screens
        with:
          name: DiBeKho-Swift-mac-arm64
          path: |
            build/DiBeKho-Swift-mac-arm64.zip
            build/DiBeKho-Swift-mac-arm64.dmg
      - uses: actions/upload-artifact@v4
        if: inputs.screens
        with:
          name: screens
          path: |
            build/screen-*.png
            build/*.xlsx.png
          if-no-files-found: ignore
