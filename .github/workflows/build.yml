# Build the macOS .dmg (Apple Silicon) and the Windows installer on GitHub's machines.
# - Push a tag like v0.1.0: builds both and publishes a GitHub Release (an old release with the same tag
#   and all earlier runs of this workflow are deleted first). The README download buttons
#   point to releases/latest/download/<fixed file name>, so they always give the newest release.
# - "Run workflow" in the Actions tab: builds only (files under "Artifacts" on the run page).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# A tag moved to a newer commit replaces a run that is still going for the same tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15  # Apple Silicon (arm64), same architecture as the M2/M3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DiBeKho-mac
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DiBeKho-windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Fixed names for the README links (the version is in the release title).
      - run: |
          cp artifacts/*-mac-arm64.dmg DiBeKho-mac-arm64.dmg
          cp artifacts/*-windows-setup.exe DiBeKho-windows-setup.exe
          ls -la
      # Only once both builds succeeded: remove the old release with this tag (and its files) and every
      # earlier run of this workflow (and its artifacts). The tag itself is kept.
      - name: Remove old release and old runs
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          for id in $(gh run list --workflow build --limit 200 --json databaseId --jq '.[].databaseId'); do
            if [ "$id" != "${{ github.run_id }}" ]; then gh run delete "$id" || true; fi
          done
      - uses: softprops/action-gh-release@v2
        with:
          name: DiBeKho ${{ github.ref_name }}
          files: |
            DiBeKho-mac-arm64.dmg
            DiBeKho-windows-setup.exe
