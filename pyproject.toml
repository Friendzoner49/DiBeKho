[project]
name = "dibekho"
version = "0.4.0"
description = "DiBeKho - theo dõi tồn kho từ các file phiếu giao hàng Excel"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.8,<6.11",
    "openpyxl>=3.1,<4",
]

[project.scripts]
dibekho = "dibekho.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyinstaller>=6.12",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dibekho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
