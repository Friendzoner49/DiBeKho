<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; connect-src https://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>DiBeKho</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Đăng nhập -->
<div id="login" class="card login hidden">
  <h1>DiBeKho</h1>
  <p class="hint">Xem tồn kho và đơn hàng. Dữ liệu là bản máy chính gửi lên lần gần nhất.</p>
  <label>Tên đăng nhập <input id="user" autocomplete="username"></label>
  <label>Mật khẩu <input id="password" type="password" autocomplete="current-password"></label>
  <button id="login-btn" class="primary">Đăng nhập</button>
  <p id="login-error" class="error"></p>
</div>

<!-- Trang chính -->
<div id="app" class="hidden">
  <header>
    <span class="brand">DiBeKho</span>
    <nav>
      <button data-tab="stock" class="tab active">Tồn kho</button>
      <button data-tab="orders" class="tab">Đơn hàng</button>
      <button data-tab="customers" class="tab">Khách hàng</button>
      <button data-tab="send" class="tab hidden" id="send-tab">Gửi hàng về</button>
    </nav>
    <span id="freshness" class="freshness"></span>
    <button id="logout" class="flat">Đăng xuất</button>
  </header>

  <main>
    <div class="toolbar">
      <input id="filter" placeholder="Tìm (không cần gõ dấu)…">
      <button id="reload" class="flat" title="Tải lại dữ liệu">⟳ Tải lại</button>
    </div>
    <p id="load-error" class="error"></p>
    <div id="tab-stock" class="pane"></div>
    <div id="tab-orders" class="pane hidden"></div>
    <div id="tab-customers" class="pane hidden"></div>
    <div id="tab-send" class="pane hidden">
      <div class="card form">
        <h2>Gửi phiếu hàng về</h2>
        <p class="hint">Phiếu gửi đi sẽ nằm chờ; chỉ khi máy chính duyệt mới được vào sổ.</p>
        <div class="grid">
          <label>Ngày <input id="rc-date" type="date"></label>
          <label>Nguồn hàng <input id="rc-source" placeholder="Cửa khẩu / công ty mẹ…"></label>
          <label>Nhập vào <select id="rc-loc"><option value="1">Kho tổng</option><option value="2">Văn phòng</option></select></label>
        </div>
        <div id="rc-lines"></div>
        <button id="rc-add" class="flat">＋ Thêm dòng</button>
        <label>Ghi chú <input id="rc-note"></label>
        <button id="rc-send" class="primary narrow">Gửi lên máy chính</button>
        <p id="rc-msg" class="hint"></p>
        <p id="rc-error" class="error"></p>
      </div>
      <h2>Đã gửi</h2>
      <div id="rc-sent"></div>
      <datalist id="products-dl"></datalist>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
        integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
