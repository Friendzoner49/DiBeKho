<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self'; connect-src 'self' https://*.supabase.co https://open.er-api.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>DiBeKho</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Every text of the page comes from i18n.js (data-i18n = text, data-i18n-ph = placeholder, data-i18n-title = tooltip):
     Tiếng Việt and 中文 (user's request 14/11/2026: the Chinese boss reads the web). -->

<!-- Đăng nhập -->
<div id="login" class="card login hidden">
  <div class="login-lang"><select id="lang-login" class="lang" aria-label="Language"></select></div>
  <h1 class="brand"><img src="logo.png" alt="" width="40" height="40"> DiBeKho</h1>
  <p class="hint" data-i18n="login.lead"></p>
  <label><span data-i18n="login.user"></span> <input id="user" autocomplete="username"></label>
  <label><span data-i18n="login.password"></span> <input id="password" type="password" autocomplete="current-password"></label>
  <label class="check"><input id="remember" type="checkbox" checked> <span data-i18n="login.remember"></span></label>
  <p class="hint" data-i18n="login.remember_hint"></p>
  <button id="login-btn" class="primary" data-i18n="login.button"></button>
  <p id="login-error" class="error"></p>
</div>

<!-- Trang chính: bố cục giống app (thanh bên trái, nút chung ở trên) -->
<div id="app" class="shell hidden">
  <aside class="side">
    <div class="brand side-brand"><img src="logo.png" alt="" width="36" height="36"> DiBeKho</div>
    <button data-page="dashboard" class="nav only-owner" data-i18n="nav.dashboard"></button>
    <button data-page="stock" class="nav active" data-i18n="nav.stock"></button>
    <button data-page="pending" class="nav" id="nav-pending" data-i18n="nav.pending"></button>
    <button data-page="search" class="nav" data-i18n="nav.search"></button>
    <button data-page="receipts" class="nav" data-i18n="nav.receipts"></button>
    <button data-page="count" class="nav" data-i18n="nav.count"></button>
    <button data-page="settings" class="nav" data-i18n="nav.settings"></button>
    <span class="spacer"></span>
    <button id="fx-btn" class="fx-btn" data-i18n-title="fx.title">¥ ⇄ ₫</button>
  </aside>

  <section class="main">
    <div class="topbar">
      <button id="reload" data-i18n="top.reload"></button>
      <button id="issue-new" class="only-maker not-phone" data-i18n="issue.button"></button>
      <span id="freshness" class="hint"></span>
      <span class="spacer"></span>
      <select id="lang-app" class="lang not-phone" aria-label="Language"></select>
      <button id="who" class="who" data-i18n-title="top.who_tip"></button>
      <button id="logout-phone" class="only-phone" data-i18n="top.logout"></button>
    </div>
    <p id="load-error" class="error"></p>

    <!-- Tổng quan (chỉ vai trò máy chính) -->
    <div id="page-dashboard" class="page hidden">
      <div class="dash-head">
        <h1 data-i18n="nav.dashboard"></h1>
        <label><span data-i18n="dash.period"></span> <select id="dash-period"></select></label>
      </div>
      <p id="dash-range" class="hint"></p>
      <div id="dash-kpis" class="kpis"></div>
      <div id="dash-banner"></div>
      <div class="dash-grid">
        <section class="panel wide"><h2 data-i18n="dash.revenue_12"></h2><div id="dash-months"></div></section>
        <section class="panel" id="dash-products"></section>
        <section class="panel" id="dash-customers"></section>
        <section class="panel" id="dash-low"></section>
        <section class="panel" id="dash-recent"></section>
      </div>
    </div>

    <!-- Tồn kho -->
    <div id="page-stock" class="page">
      <h1 data-i18n="nav.stock"></h1>
      <p class="hint not-phone" data-i18n="stock.hint"></p>
      <div class="row">
        <input id="stock-filter" class="grow" data-i18n-ph="stock.filter">
        <label class="check"><input id="stock-low" type="checkbox"> <span data-i18n="stock.only_low"></span></label>
      </div>
      <p id="stock-banner" class="banner hidden"></p>
      <div id="stock-table"></div>
      <p id="stock-summary" class="hint"></p>
    </div>

    <!-- Cần xử lý -->
    <div id="page-pending" class="page hidden">
      <h1 data-i18n="nav.pending"></h1>
      <h2 data-i18n="pending.unplaced"></h2>
      <p class="hint" data-i18n="pending.unplaced_hint"></p>
      <div id="pending-unplaced"></div>
    </div>

    <!-- Tra cứu -->
    <div id="page-search" class="page hidden">
      <h1 data-i18n="nav.search"></h1>
      <p class="hint" data-i18n="search.hint"></p>
      <input id="search-input" class="wide" data-i18n-ph="search.placeholder">
      <div id="search-results"></div>
      <div class="row more">
        <span class="hint" data-i18n="search.more"></span>
        <button data-sub="orders" data-i18n="search.orders"></button>
        <button data-sub="customers" data-i18n="search.customers"></button>
        <button data-sub="stats" data-i18n="search.stats"></button>
      </div>
    </div>

    <!-- Tra cứu → Đơn hàng -->
    <div id="page-orders" class="page hidden">
      <div class="backbar"><button class="back" data-back="search" data-i18n="back.search"></button><h1 data-i18n="nav.orders"></h1></div>
      <p class="hint" data-i18n="hint.open_row"></p>
      <div class="row">
        <label><span data-i18n="orders.kind"></span> <select id="orders-kind"></select></label>
        <input id="orders-filter" class="grow" data-i18n-ph="orders.filter">
        <label class="check"><input id="orders-closed" type="checkbox"> <span data-i18n="orders.closed"></span></label>
      </div>
      <div id="orders-table"></div>
      <p id="orders-count" class="hint"></p>
    </div>

    <!-- Tra cứu → Khách hàng -->
    <div id="page-customers" class="page hidden">
      <div class="backbar"><button class="back" data-back="search" data-i18n="back.search"></button><h1 data-i18n="nav.customers"></h1></div>
      <p class="hint" data-i18n="customers.hint"></p>
      <div class="row">
        <input id="customers-filter" class="grow" data-i18n-ph="customers.filter">
      </div>
      <div id="customers-table"></div>
    </div>

    <!-- Tra cứu → Thống kê -->
    <div id="page-stats" class="page hidden">
      <div class="backbar"><button class="back" data-back="search" data-i18n="back.search"></button><h1 data-i18n="nav.stats"></h1></div>
      <div class="row wrap">
        <label><span data-i18n="st.period"></span> <select id="st-period"><option value="day" data-i18n="period.day"></option>
          <option value="month" selected data-i18n="period.month"></option><option value="quarter" data-i18n="period.quarter"></option>
          <option value="year" data-i18n="period.year"></option><option value="range" data-i18n="period.range"></option></select></label>
        <label id="st-l-day" class="hidden"><span data-i18n="period.day"></span> <input id="st-day" type="date"></label>
        <label id="st-l-month"><span data-i18n="period.month"></span> <input id="st-month" type="month"></label>
        <label id="st-l-year" class="hidden"><span data-i18n="period.year"></span> <input id="st-year" type="number" min="2000" max="2100"></label>
        <label id="st-l-quarter" class="hidden"><span data-i18n="period.quarter"></span> <select id="st-quarter"><option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option></select></label>
        <label id="st-l-from" class="hidden"><span data-i18n="st.from"></span> <input id="st-from" type="date"></label>
        <label id="st-l-to" class="hidden"><span data-i18n="st.to"></span> <input id="st-to" type="date"></label>
        <label><span data-i18n="st.scope"></span> <select id="st-scope"><option value="all" data-i18n="st.scope_all"></option>
          <option value="category" data-i18n="st.scope_category"></option><option value="product" data-i18n="st.scope_product"></option>
          <option value="customer" data-i18n="st.scope_customer"></option></select></label>
        <label id="st-l-value" class="hidden"><span data-i18n="st.pick"></span> <select id="st-value"></select></label>
        <label><span data-i18n="st.by"></span> <select id="st-by"><option value="none" data-i18n="st.by_none"></option>
          <option value="day" data-i18n="period.day"></option><option value="month" data-i18n="period.month"></option></select></label>
      </div>
      <div id="st-summary"></div>
      <div id="st-chart"></div>
      <div id="st-table"></div>
      <div id="st-top"></div>
    </div>

    <!-- chi tiết mặt hàng / khách (mở từ các trang trên) -->
    <div id="page-detail" class="page hidden"></div>

    <!-- Hàng về -->
    <div id="page-receipts" class="page hidden">
      <h1 data-i18n="nav.receipts"></h1>
      <p class="hint" data-i18n="receipts.hint"></p>
      <h2 data-i18n="receipts.list"></h2>
      <div id="receipts-table"></div>
    </div>

    <!-- Kiểm kê -->
    <div id="page-count" class="page hidden">
      <h1 data-i18n="nav.count"></h1>
      <p class="hint" data-i18n="count.hint"></p>
      <div class="row wrap">
        <button data-doclist="transfer" data-i18n="count.transfers"></button>
        <button data-doclist="trial" data-i18n="count.trials"></button>
        <button data-doclist="stock_count" data-i18n="count.counts"></button>
      </div>
      <div id="count-table"></div>
    </div>

    <!-- Cài đặt -->
    <div id="page-settings" class="page hidden">
      <h1 data-i18n="nav.settings"></h1>
      <div class="tabs">
        <button data-stab="general" class="stab active" data-i18n="settings.general"></button>
        <button data-stab="products" class="stab" data-i18n="settings.products"></button>
        <button data-stab="transfer" class="stab only-owner" data-i18n="settings.backup"></button>
        <button data-stab="accounts" class="stab only-admin" data-i18n="settings.accounts"></button>
      </div>
      <div id="stab-general" class="spane">
        <dl class="info" id="settings-info"></dl>
        <div class="row wrap">
          <label for="lang-settings" data-i18n="settings.language"></label>
          <select id="lang-settings" class="lang"></select>
        </div>
        <div class="row wrap only-admin">
          <label for="ui-scale" data-i18n="settings.scale"></label>
          <select id="ui-scale"><option value="100" data-i18n="settings.scale_100"></option><option value="110" data-i18n="settings.scale_110"></option>
            <option value="120" data-i18n="settings.scale_120"></option></select>
        </div>
        <button id="logout" data-i18n="top.logout"></button>
      </div>
      <div id="stab-products" class="spane hidden">
        <p class="hint" data-i18n="catalog.hint"></p>
        <div class="row wrap">
          <input id="catalog-filter" class="grow" data-i18n-ph="catalog.filter">
        </div>
        <div id="catalog-table"></div>
      </div>
      <div id="stab-transfer" class="spane hidden only-owner">
        <h2 data-i18n="pkg.title"></h2>
        <p class="hint" data-i18n="pkg.hint"></p>
        <div class="row wrap">
          <button id="pkg-export" data-i18n="pkg.export"></button>
        </div>
        <p id="pkg-msg" class="hint"></p>
      </div>
      <div id="stab-accounts" class="spane hidden only-admin">
        <p class="hint" data-i18n="acc.hint"></p>
        <div class="row wrap">
          <button id="acc-btn-add" data-i18n="acc.add"></button>
          <button id="acc-btn-role" data-i18n="acc.role"></button>
          <button id="acc-btn-pass" data-i18n="acc.pass"></button>
          <button id="acc-btn-revoke" data-i18n="acc.revoke"></button>
          <button id="acc-btn-delete" data-i18n="acc.delete"></button>
          <button id="acc-btn-reload" class="flat" data-i18n="acc.reload"></button>
        </div>
        <p id="acc-msg" class="hint"></p>
        <div id="acc-table"></div>
      </div>
    </div>
  </section>
</div>

<!-- cửa sổ (như các cửa sổ của app) -->
<dialog id="dlg">
  <div class="dlg-head"><h2 id="dlg-title"></h2><button id="dlg-x" class="flat" data-i18n-title="btn.close">✕</button></div>
  <div id="dlg-body"></div>
  <p id="dlg-error" class="error"></p>
  <div id="dlg-buttons" class="dlg-buttons"></div>
</dialog>
<datalist id="products-dl"></datalist>
<datalist id="customers-dl"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"
        integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="stats.js"></script>
<script src="app.js"></script>
<script src="views.js"></script>
<script src="dashboard.js"></script>
<script src="vendor/fflate.js"></script>
<script src="xlsx.js"></script>
<script src="issue.js"></script>
<script src="fx.js"></script>
<script src="accounts.js"></script>
<script src="schema.js"></script>
<script src="package.js"></script>
</body>
</html>
